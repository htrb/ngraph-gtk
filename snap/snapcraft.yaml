# SPDX-License-Identifier: GPL-2.0-or-later
name: ngraph-gtk-htrb
title: "Ngraph-gtk"
contact: "ZXB01226@nifty.com"
license: "GPL-2.0+"
website: "https://htrb.github.io/homepage/ngraph/ngraph-gtk.html"
source-code: "https://github.com/htrb/ngraph-gtk"
issues: "https://github.com/htrb/ngraph-gtk/issues"
version: '6.10.00-RC1'
summary: the program to create scientific 2-dimensional graphs.
description: |
  Ngraph is a program for creating scientific 2-dimensional graphs
  for researchers and engineers. Graphs can be exported in
  PostScript, SVG, PNG, or PDF format.

grade: stable # stable | devel
confinement: strict
base: core24
platforms:
  amd64:
  arm64:
  armhf:

apps:
  ngraph-gtk:
    command: usr/bin/ngraph-snap.sh
    extensions: [gnome]
    plugs:
      - gsettings # For desktop theme detection under Wayland session
      - home
      - cups-control
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - removable-media
#    slots:
#      - dbus-daemon
    common-id: com.github.htrb.ngraph-gtk.desktop
    desktop: usr/share/applications/com.github.htrb.ngraph-gtk.desktop

parts:
  ngraph-gtk:
    source: https://github.com/htrb/ngraph-gtk.git
    source-branch: master
#    source-tag: v6.09.11
    plugin: autotools
    autotools-configure-parameters:
      - --prefix=/usr
      - --sysconfdir=/etc
      - CFLAGS="-g -O2 -DLC_MESSAGES=5"
    override-build: |
       craftctl default
       cp snap/local/ngraph-snap.sh $SNAPCRAFT_PART_INSTALL/usr/bin/
       mkdir -p $SNAPCRAFT_PRIME/meta/gui
       sed -i.bak -e 's|Exec=ngraph|Exec=ngraph-gtk-htrb.ngraph-gtk|g' -e 's|Name=Ngraph-GTK|Name=Ngraph-GTK (Snap)|g' misc/com.github.htrb.ngraph-gtk.desktop
       cp misc/com.github.htrb.ngraph-gtk.desktop misc/ngraph-gtk.desktop
       mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/applications
       cp misc/com.github.htrb.ngraph-gtk.desktop $SNAPCRAFT_PART_INSTALL/usr/share/applications/
       cp misc/ngraph-gtk.desktop $SNAPCRAFT_PART_INSTALL/usr/share/applications/
       mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps
       mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/48x48/apps
       cp icons/application-x-ngraph.xpm $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/48x48/apps/ngraph.xpm
       cp icons/scalable/apps/ngraph.svg $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/
       cp icons/scalable/apps/ngraph.svg $SNAPCRAFT_PRIME/meta/gui/
    build-packages:
      - libgsl-dev
      - gettext
      - libreadline-dev
      - ruby-dev
      - libminizip-dev
      - libexpat1-dev
      - libgtksourceview-5-dev
      - autoconf-archive
    stage-packages:
      - ruby
      - xterm
    parse-info: [usr/share/metainfo/com.github.htrb.ngraph-gtk.metainfo.xml]

  libraries:
    plugin: nil
    stage-packages:
      - libgsl27
      - libminizip1t64
      - libexpat1
      - libcairo-gobject2
      - libcairo2
      - libdatrie1
      - libepoxy0
      - libfontconfig1
      - libfreetype6
      - libgdk-pixbuf2.0-0
      - libgraphite2-3
      - libgtk-4-1
      - libgtksourceview-5-0
      - libharfbuzz0b
      - libicu74
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libpangoft2-1.0-0
      - libpixman-1-0
      - libpng16-16t64
      - libthai0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libxau6
      - libxcb-render0
      - libxcb-shm0
      - libxcb1
      - libxcursor1
      - libxdamage1
      - libxdmcp6
      - libxext6
      - libxfixes3
      - libxi6
      - libxinerama1
      - libxkbcommon0
      - libxml2
      - libxrandr2
      - libxrender1
